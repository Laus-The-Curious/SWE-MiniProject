name: Main Workflow

on:
  # Run on PRs targeting main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Important: Disables shallow clones for better analysis

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Compile Java
      run: javac main.java

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v4
      with:
        projectBaseDir: .
        args: >
          -Dsonar.projectKey=MiniProject-Swe-2026
          -Dsonar.sources=.
          -Dsonar.java.binaries=.
          -Dsonar.qualitygate.wait=true  # <--- CRITICAL: Fails the job if Sonar fails
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}